name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    # The plugin has no database tables, so a single database engine is enough.
    # One job per Moodle branch still supported upstream, on its minimum PHP/PostgreSQL,
    # plus the development branch (6.0dev) as an early warning that may fail.
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: 'MOODLE_405_STABLE'
            php: '8.1'
            postgres: '13'
          - moodle-branch: 'MOODLE_405_STABLE'
            php: '8.3'
            postgres: '17'
          - moodle-branch: 'MOODLE_501_STABLE'
            php: '8.2'
            postgres: '15'
          - moodle-branch: 'MOODLE_502_STABLE'
            php: '8.3'
            postgres: '16'
          - moodle-branch: 'MOODLE_503_STABLE'
            php: '8.3'
            postgres: '17'
          - moodle-branch: 'MOODLE_503_STABLE'
            php: '8.4'
            postgres: '17'
          - moodle-branch: 'main'
            php: '8.4'
            postgres: '17'
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      # Node is installed by moodle-plugin-ci from Moodle's .nvmrc, using the runner's nvm.
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
